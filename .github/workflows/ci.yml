name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test (${{ matrix.project.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: web
            working-directory: web
            type: node
            command: npm test
            cache: true
          - name: designer3d-tools
            working-directory: designer3d/tools
            type: node
            command: npm test
            cache: true
          - name: app
            working-directory: .
            type: gradle
            command: ./gradlew test
            cache: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.project.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.project.working-directory }}/package-lock.json'

      - name: Install Node.js dependencies
        if: matrix.project.type == 'node'
        run: npm ci
        working-directory: ${{ matrix.project.working-directory }}

      - name: Setup Java JDK 17
        if: matrix.project.type == 'gradle'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        if: matrix.project.type == 'gradle'
        uses: gradle/actions/setup-gradle@v3

      - name: Run subproject tests
        run: ${{ matrix.project.command }}
        working-directory: ${{ matrix.project.working-directory }}
