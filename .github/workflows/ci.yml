name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install designer3d-tools dependencies
        run: npm ci
        working-directory: designer3d/tools

      - name: Run Node lint checks
        run: npm run lint

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Node format checks
        run: npm run format:check

      - name: Run Spotless check
        run: ./gradlew spotlessCheck

  test:
    name: Test (${{ matrix.project.name }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: web
            working-directory: web
            type: node
            command: npm test
            cache: true
          - name: designer3d-tools
            working-directory: designer3d/tools
            type: node
            command: npm test
            cache: true
          - name: app
            working-directory: .
            type: gradle
            command: ./gradlew test
            cache: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.project.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.project.working-directory }}/package-lock.json'

      - name: Install Node.js dependencies
        if: matrix.project.type == 'node'
        run: npm ci
        working-directory: ${{ matrix.project.working-directory }}

      - name: Setup Java JDK 17
        if: matrix.project.type == 'gradle'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        if: matrix.project.type == 'gradle'
        uses: gradle/actions/setup-gradle@v3

      - name: Run subproject tests
        run: ${{ matrix.project.command }}
        working-directory: ${{ matrix.project.working-directory }}
