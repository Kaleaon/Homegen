<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homegen Designer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2713%27 font-size=%2713%27%3E🏠%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="top">
  <div class="brand">🏠 Homegen <span>Designer</span></div>
  <input id="plan-name" aria-label="Plan name" value="My home">
  <div class="spacer"></div>
  <button id="undo" title="Undo (Ctrl+Z)">↶</button>
  <button id="redo" title="Redo (Ctrl+Y)">↷</button>
  <label class="toggle" title="Automatically add the windows, outlets, alarms, doors and finishes the code requires after every edit"><input type="checkbox" id="auto" checked> Auto-comply</label>
  <button id="sample">Sample home</button>
  <button id="new">New</button>
  <button id="save">Save</button>
  <button id="load">Open</button>
  <button id="png">PNG</button>
  <button id="report">Code report</button>
  <input type="file" id="file" accept="application/json" hidden>
</header>
<main>
  <aside id="left">
    <nav id="tabs">
      <button data-tab="build" class="on">Build</button>
      <button data-tab="buy">Buy</button>
      <button data-tab="paint">Paint</button>
      <button data-tab="kits">Kits</button>
    </nav>
    <div id="palette"></div>
  </aside>
  <section id="stage">
    <div id="toolbar">
      <button data-tool="select" class="on" title="Select / move (V)">⬚ Select</button>
      <button data-tool="erase" title="Delete things (X)">⌫ Erase</button>
      <span id="tool-hint"></span>
      <div class="spacer"></div>
      <button id="zoom-out">−</button><span id="zoom-label">100%</span><button id="zoom-in">+</button><button id="fit">Fit</button>
    </div>
    <canvas id="plan"></canvas>
    <div id="toast" role="status" aria-live="polite"></div>
  </section>
  <aside id="right">
    <section id="inspector"></section>
    <section id="compliance"></section>
  </aside>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
